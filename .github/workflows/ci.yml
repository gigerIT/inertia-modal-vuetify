name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium-headless-shell
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run build:example

  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - uses: oven-sh/setup-bun@v2

      # The demo type-checks the adapter source, whose imports resolve from the root install.
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: touch database/database.sqlite && php artisan migrate --force
      - run: npm ci
      - run: npm run lint:test
      - run: npx eslint .
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build:ssr
      - run: composer run test
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: php artisan inertia:start-ssr &
      - run: npm run test:e2e
        env:
          E2E_SSR: "1"
